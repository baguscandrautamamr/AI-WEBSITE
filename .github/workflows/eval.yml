name: Eval

# TIDAK jalan di push, dan itu keputusan.
#
# Suite ini memanggil model bahasa yang sungguhan: berbiaya, butuh jaringan, dan
# hasilnya tidak sepenuhnya sama dari satu jalannya ke jalannya berikutnya. Di
# setiap push, ia akan sesekali merah karena hal yang bukan kesalahan siapa pun —
# dan CI yang begitu berhenti dibaca dalam dua minggu, sesudah itu ia tidak
# menjaga apa pun.
#
# Yang dijaga eval ini bukan kode melainkan PERILAKU MODEL, dan perilaku model
# bergeser karena hal-hal yang tidak ada di dalam repo ini: `claude-sonnet-5`
# adalah ID lengkap tanpa varian bertanggal, jadi tidak ada versi yang bisa
# dikunci. Pergeserannya tidak akan datang bersama sebuah commit — jadi yang
# memeriksanya juga tidak boleh menunggu commit.
on:
  schedule:
    # 22:00 UTC = 05:00 WIB. Hasilnya sudah ada sebelum orang mulai bekerja.
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  eval:
    name: Perilaku model (electrical + standard)
    runs-on: ubuntu-latest

    # Tanpa AI_GATEWAY_API_KEY, suite MELEWATI dirinya sendiri dan job jadi hijau.
    # Hijau tanpa arti, dan itu memang jebakannya: sebuah eval yang dilewati
    # terlihat sama dengan eval yang lulus. Yang membedakannya cuma peringatan di
    # log ("AI_GATEWAY_API_KEY tidak ada — eval dilewati"), jadi itu yang harus
    # dicari lebih dulu sebelum menyimpulkan perilakunya masih baik.
    #
    # Tidak dijadikan `if:` di sini karena secrets tidak bisa dibaca di tingkat
    # job condition dengan cara yang bisa dipercaya.

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Eval
        env:
          # Dipasang di Settings → Secrets and variables → Actions.
          # Tanpa keduanya, suite melewati dirinya sendiri dengan peringatan.
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_GATEWAY_BASE_URL: ${{ secrets.AI_GATEWAY_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: npm run eval
