name: Eval

# MANUAL SAJA. Tidak di push, dan tidak berjadwal.
#
# Tidak di push: suite ini memanggil model bahasa yang sungguhan — berbiaya,
# butuh jaringan, dan hasilnya tidak sepenuhnya sama dari satu jalannya ke
# jalannya berikutnya. Di setiap push ia akan sesekali merah karena hal yang
# bukan kesalahan siapa pun, dan CI yang begitu berhenti dibaca dalam dua minggu.
#
# Tidak berjadwal, dan ini yang perlu dijelaskan karena sebelumnya ia berjadwal
# tiap malam. Sebabnya bukan biaya: tanpa secret AI_GATEWAY_API_KEY terpasang,
# suite MELEWATI dirinya sendiri dan job-nya HIJAU. Sebuah centang hijau tiap
# pagi yang tidak memeriksa apa pun lebih buruk daripada tidak ada centang: ia
# melatih orang percaya ada yang menjaga.
#
# Jadi ia dijalankan pada saat yang memang menuntutnya, oleh orang yang tahu
# kenapa ia menjalankannya:
#
#   - sebelum mengubah salah satu dari dua system prompt
#   - sebelum menaikkan AI_MODEL
#   - saat sebuah laporan pengguna mengarah ke perilaku model, bukan ke kode
#
# Yang kedua itu sebab utama suite ini ada. `claude-sonnet-5` adalah ID lengkap
# tanpa varian bertanggal, jadi tidak ada versi yang bisa dikunci — dan
# pergeserannya tidak akan datang bersama sebuah commit. Yang memberi tahu tanpa
# perlu dijalankan siapa pun tetap ada: kolom `model_served` di ai_events, dan
# kueri nomor 6 di supabase/queries/ai_health.sql.
#
# Menghidupkan jadwalnya kembali: kembalikan blok `schedule:` di bawah, SETELAH
# secret-nya terpasang. Sebelum itu, ia cuma menghasilkan hijau yang kosong.
#
#   schedule:
#     - cron: "0 22 * * *"   # 22:00 UTC = 05:00 WIB
on:
  workflow_dispatch:

jobs:
  eval:
    name: Perilaku model (electrical + standard)
    runs-on: ubuntu-latest

    # Tanpa AI_GATEWAY_API_KEY, suite MELEWATI dirinya sendiri dan job jadi hijau.
    # Hijau tanpa arti, dan itu memang jebakannya: sebuah eval yang dilewati
    # terlihat sama dengan eval yang lulus. Yang membedakannya cuma peringatan di
    # log ("AI_GATEWAY_API_KEY tidak ada — eval dilewati"), jadi itu yang harus
    # dicari lebih dulu sebelum menyimpulkan perilakunya masih baik.
    #
    # Tidak dijadikan `if:` di sini karena secrets tidak bisa dibaca di tingkat
    # job condition dengan cara yang bisa dipercaya.

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Eval
        env:
          # Dipasang di Settings → Secrets and variables → Actions.
          # Tanpa keduanya, suite melewati dirinya sendiri dengan peringatan.
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_GATEWAY_BASE_URL: ${{ secrets.AI_GATEWAY_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: npm run eval
