name: CI

# Jalan di semua branch, bukan hanya main: branch kerja yang belum di-PR dulu
# tidak diperiksa sama sekali, jadi kegagalannya baru muncul saat PR dibuka.
on:
  push:
  pull_request:

# Batalkan run lama kalau ada push baru di branch/PR yang sama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, typecheck & build (web)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # Halaman /login di-prerender saat build dan membuat Supabase client,
        # jadi build butuh kedua variabel ini ada — nilainya tidak perlu asli.
        # Kunci Cloudinary & AI gateway TIDAK dibutuhkan: dipakai runtime saja.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build
        run: npm run build
